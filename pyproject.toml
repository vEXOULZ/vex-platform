[project]
name = "vex-platform"
version = "0.3.0"
description = "Shared job runtime, API conventions and audit log for twitch-archive and doomtp-bot"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # Exact pin: the jobs schema SQL in vex_platform/migrations is a frozen copy of this
    # version's. Bumping it means shipping procrastinate's migrations as a new revision there.
    "procrastinate==3.10.0",
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "structlog>=24.1",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy[asyncio]>=2.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vex_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["spike"]  # the Phase 0 spike, kept as a record

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
