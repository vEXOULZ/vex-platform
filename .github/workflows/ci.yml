name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vex
          POSTGRES_PASSWORD: vex
          POSTGRES_DB: vex_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vex"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      VEX_TEST_DSN: postgresql://vex:vex@127.0.0.1:5432/vex_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --all-extras
      - run: uv run ruff check
      - run: uv run pytest -q
