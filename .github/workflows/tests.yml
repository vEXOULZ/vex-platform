name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conventional Branch
        # Through the environment, never interpolated into the script: a branch name is user input.
        env:
          BRANCH: ${{ github.head_ref }}
        run: .githooks/check-branch-name.sh "$BRANCH"

  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vex
          POSTGRES_PASSWORD: vex
          POSTGRES_DB: vex_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vex"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      VEX_TEST_DSN: postgresql://vex:vex@127.0.0.1:5432/vex_platform_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run pytest -q
